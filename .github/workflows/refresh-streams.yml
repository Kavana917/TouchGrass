name: Refresh Live Feed

# Rebuilds the stream registry from YouTube and commits it.
#
# This is the whole "backend". There is no server: a scheduled script writes
# a JSON file, every phone reads that file, and the video itself streams
# straight from YouTube's CDN to the device. Cost is O(channels), not
# O(users) — the same handful of API calls whether ten people use the app or
# ten million (tech_stack.md §5.1).
#
# QUOTA MATH, because it's the constraint that shapes everything here:
#   search.list is capped at 100 calls/day for the whole project.
#   4 runs/day × 20 searches/run (MAX_SEARCH_CALLS_PER_RUN) = 80/day worst case.
#   Typical runs spend 1 unit and zero searches, because nothing died.
# Change the schedule and you must change that constant to match.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Rediscover every channel, ignoring what is already live'
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths:
      - 'server/channels.json'   # curating a channel should take effect now
      - 'server/refresh_streams.py'
      - '.github/workflows/refresh-streams.yml'

# Needed for the commit step. Nothing else in the repo needs write access.
permissions:
  contents: write

# A slow run must never overlap the next scheduled one and race the commit.
concurrency:
  group: refresh-streams
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No pip install step: the script is deliberately stdlib-only, so there
      # is no dependency to rot, pin, or audit.
      - name: Rebuild the registry
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python server/refresh_streams.py ${{ inputs.full && '--full' || '' }}

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/streams.json server/channel_ids.json
          if git diff --staged --quiet; then
            echo "No change — every stream is exactly as it was."
            exit 0
          fi
          git commit -m "Refresh Live Feed registry"
          # Rebase rather than force: a human editing channels.json mid-run
          # should not have their commit thrown away.
          git pull --rebase --autostash
          git push
