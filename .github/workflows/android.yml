name: Android CI

# Build and test on every push and pull request.
# Keeps `main` honest: if this badge is red, the app doesn't compile.
on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:   # lets you trigger a run by hand from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Caches Gradle dependencies between runs, so later builds take
      # ~1 minute instead of ~5.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: android

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: android

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
        working-directory: android

      # Worth its runtime: lint caught a real crash-on-Android-9 bug in
      # Phase 2 that compiled fine and passed tests.
      - name: Run lint
        run: ./gradlew lintDebug --stacktrace
        working-directory: android

      # Uploaded so you can download and install the build from any commit
      # without needing Android Studio open.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: touchgrass-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Only uploaded when something fails — that's when you need them.
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/app/build/reports/
